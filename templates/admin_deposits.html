<!DOCTYPE html>
<html>
<head><title>Admin Deposits - គ្រប់គ្រងការតម្កល់</title></head>
<body>
    <h1>បញ្ជីប្រាក់តម្កល់ដែលកំពុងរងចាំ</h1>
    <table border="1">
        <tr>
            <th>ID</th><th>អ្នកប្រើ</th><th>ចំនួន</th><th>ថ្ងៃ</th><th>សកម្មភាព</th>
        </tr>
        {% for dep in deposits %}
        <tr>
            <td>{{ dep.id }}</td>
            <td>{{ dep.user_id }} (ស្វែងរកឈ្មោះបាន ប៉ុន្តែអាចបន្ថែម join)</td>
            <td>${{ '%.2f'|format(dep.amount) }}</td>
            <td>{{ dep.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
            <td>
                <form method="POST" action="{{ url_for('admin_deposits_approve', deposit_id=dep.id) }}" style="display:inline">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <button type="submit">✅ យល់ព្រម</button>
                </form>
                <form method="POST" action="{{ url_for('admin_deposits_reject', deposit_id=dep.id) }}" style="display:inline">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <button type="submit">❌ បដិសេធ</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{{ url_for('admin_deposits') }}">ធ្វើឲ្យទាន់សម័យ</a></p>
</body>
</html>
